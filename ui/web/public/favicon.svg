<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Capy">
  <defs>
    <linearGradient id="capy-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c09263"/>
      <stop offset="1" stop-color="#8a5f3c"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <ellipse cx="30" cy="33" rx="11" ry="13" fill="#7a5233"/>
  <ellipse cx="90" cy="33" rx="11" ry="13" fill="#7a5233"/>
  <!-- head -->
  <rect x="17" y="27" width="86" height="68" rx="27" fill="url(#capy-fur)"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="75" rx="25" ry="18" fill="#dcb88f"/>
  <!-- eyes -->
  <circle cx="44" cy="55" r="6" fill="#2b2118"/>
  <circle cx="76" cy="55" r="6" fill="#2b2118"/>
  <circle cx="46" cy="53" r="2" fill="#ffffff" opacity="0.85"/>
  <circle cx="78" cy="53" r="2" fill="#ffffff" opacity="0.85"/>
  <!-- nostrils -->
  <ellipse cx="55" cy="70" rx="3" ry="4" fill="#3a2a1c"/>
  <ellipse cx="65" cy="70" rx="3" ry="4" fill="#3a2a1c"/>
  <!-- mouth -->
  <path d="M50 80 q10 9 20 0" stroke="#3a2a1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
